<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sistem Gamara Attire</title>
  <style>
    /* Menghilangkan margin/padding bawaan browser yang memicu scrollbar */
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden; /* Kunci scroll pada level paling luar */
      background-color: #ffffff; /* Sesuaikan dengan warna dashboard */
    }

    .iframe-container {
      position: fixed; /* Menggunakan fixed agar benar-benar mengunci posisi */
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block; /* Menghilangkan celah kecil di bawah iframe */
    }
  </style>
</head>
<body>

<div class="iframe-container">
  <iframe 
    src="https://script.google.com/macros/s/AKfycbxArNPSVpxG97qQ5lyaFGfJeGRWlFV5OfWk-d60tFUk8ZYsGfACUxXpAe9qbR0fqf9uCg/exec" 
    allow="camera; microphone; geolocation"
    title="Sistem Gamara Attire">
  </iframe>
</div>

</body>
</html>

<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5b5ce2"><meta name="description" content="Time Tracker PWA">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg">
<title>Time Tracker</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px system-ui;background:#f4f6fb;color:#182230}
header{height:58px;background:#fff;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.brand{font-weight:800;color:#5556d9}button{border:0;background:#5b5ce2;color:white;padding:9px 13px;border-radius:9px;cursor:pointer}
main{height:calc(100dvh - 58px);padding:0}iframe{border:0;width:100%;height:100%;background:white}
#notice{display:none;background:#fff3cd;color:#664d03;padding:9px 14px;font-size:13px}
</style>
</head>
<body>
<header><div class="brand">⏱ Time Tracker <small style="font-weight:400;color:#7b8797">PWA</small></div><button id="reload">Refresh</button></header>
<div id="notice">Masukkan URL deployment Apps Script pada <code>config.js</code> terlebih dahulu.</div>
<main><iframe id="app" title="Time Tracker app" allow="clipboard-read; clipboard-write; fullscreen"></iframe></main>
<script src="./config.js"></script>
<script>
const url=(window.TT_CONFIG||{}).GAS_URL||'';
const frame=document.getElementById('app');
if(url && url.startsWith('https://script.google.com/')) frame.src=url;
else document.getElementById('notice').style.display='block';
document.getElementById('reload').onclick=()=>frame.src=frame.src;
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
</script>
</body></html>

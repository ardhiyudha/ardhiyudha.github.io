<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Presensi</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f3f4f6;
        }

        .wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: auto; /* Memungkinkan scroll jika konten sangat besar */
            -webkit-overflow-scrolling: touch;
        }

        iframe {
            /* Perbesar kanvas iframe agar konten di dalamnya merasa punya ruang luas */
            width: 125%; 
            height: 125%;
            
            /* Kecilkan kembali secara visual ke 0.8 dari 125% (hasilnya mendekati zoom-in konten) */
            /* Atau gunakan scale(1.2) langsung dengan lebar 80% */
            
            transform: scale(1.2); 
            transform-origin: 0 0;
            
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Khusus Mobile: Jika masih kurang besar, kita paksa lebarnya */
        @media screen and (max-width: 480px) {
            iframe {
                width: 83.33%; /* 100 / 1.2 */
                height: 83.33%;
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbxT_2_bsjZfbnZYe6Cew4sUO-MasOlHofzbGKkhmq9M23AjTJV0oYtYQ-i1_0QdHI0c/exec" 
            allow="geolocation; camera; microphone">
        </iframe>
    </div>

</body>
</html>

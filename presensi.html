<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
    <title>Presensi</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f3f4f6;
        }

        .zoom-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        iframe {
            /* 100 / 1.2 = 83.33 */
            width: 83.33%; 
            height: 83.33%;
            
            border: none;
            position: absolute;
            top: 0;
            left: 0;

            /* Zoom level 1.2 (120%) */
            transform: scale(1.2);
            transform-origin: 0 0;
            
            /* Memastikan visual tetap memenuhi layar */
            width: 83.33vw !important;
            height: 83.33vh !important;
            
            /* Support untuk browser lama */
            -webkit-transform: scale(1.2);
            -webkit-transform-origin: 0 0;
        }

        /* Optimalisasi untuk layar ponsel */
        @media screen and (max-width: 480px) {
            iframe {
                width: 83.33%; 
                height: 83.33%;
                transform: scale(1.2);
            }
        }
    </style>
</head>
<body>

    <div class="zoom-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbxT_2_bsjZfbnZYe6Cew4sUO-MasOlHofzbGKkhmq9M23AjTJV0oYtYQ-i1_0QdHI0c/exec" 
            allow="geolocation; camera; microphone">
        </iframe>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f3f4f6;
        }

        .container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        iframe {
            /* Trik Anti Blur: */
            /* 1. Buat resolusi iframe 2x lipat lebih besar dari layar (200%) */
            width: 200%;
            height: 200%;
            
            /* 2. Kecilkan kembali ke ukuran layar menggunakan scale(0.5) */
            /* Ini akan memadatkan pixel sehingga tampilan sangat tajam */
            transform: scale(0.5);
            transform-origin: 0 0;
            
            border: none;
        }

        /* Khusus Mobile: Jika ingin konten terlihat 125% lebih besar tapi tajam */
        @media screen and (max-width: 480px) {
            iframe {
                /* Logika: Kita buat kanvas sebesar 160% agar konten merapat, 
                   lalu kita scale 0.625 untuk ketajaman (160 * 0.625 = 100) */
                width: 160%; 
                height: 160%;
                transform: scale(0.625);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbxT_2_bsjZfbnZYe6Cew4sUO-MasOlHofzbGKkhmq9M23AjTJV0oYtYQ-i1_0QdHI0c/exec" 
            allow="geolocation; camera; microphone">
        </iframe>
    </div>

</body>
</html>

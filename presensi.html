<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f3f4f6;
        }

        .container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: auto; /* Memungkinkan scroll jika konten melebihi layar setelah di-zoom */
            -webkit-overflow-scrolling: touch;
        }

        iframe {
            /* Kita buat iframe-nya seolah-olah berjalan di layar yang lebih kecil (misal 66%) 
               lalu kita perbesar 1.5x (150%) agar elemen di dalamnya terlihat raksasa */
            width: 66.6%; 
            height: 66.6%;
            
            /* Zoom 1.5x */
            transform: scale(1.5);
            transform-origin: 0 0;
            
            /* Cadangan untuk browser tertentu */
            zoom: 1.5; 
            
            /* Koreksi ukuran agar tetap mengisi layar penuh setelah di-scale */
            width: 66.6vw !important;
            height: 66.6vh !important;
            
            border: none;
        }

        /* Penyesuaian khusus untuk layar HP yang sangat kecil */
        @media screen and (max-width: 480px) {
            iframe {
                width: 66.6%; 
                height: 66.6%;
                transform: scale(1.5);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbxT_2_bsjZfbnZYe6Cew4sUO-MasOlHofzbGKkhmq9M23AjTJV0oYtYQ-i1_0QdHI0c/exec" 
            allow="geolocation; camera; microphone">
        </iframe>
    </div>

</body>
</html>

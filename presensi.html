<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Presensi</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f3f4f6;
        }

        .zoom-container {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        iframe {
            /* Kita gunakan rumus 100 / scale */
            /* Jika scale 1.1, maka width & height adalah 90.9% */
            width: 90.9%; 
            height: 90.9%;
            
            border: none;
            position: absolute;
            top: 0;
            left: 0;

            /* Zoom level 1.1 (110%) */
            transform: scale(1.1);
            transform-origin: 0 0;
            
            /* Menyesuaikan ukuran agar tetap full screen secara visual */
            width: 90.9vw !important;
            height: 90.9vh !important;
        }

        /* Khusus Mobile */
        @media screen and (max-width: 480px) {
            iframe {
                width: 90.9%; 
                height: 90.9%;
                transform: scale(1.1);
            }
        }
    </style>
</head>
<body>

    <div class="zoom-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbxT_2_bsjZfbnZYe6Cew4sUO-MasOlHofzbGKkhmq9M23AjTJV0oYtYQ-i1_0QdHI0c/exec" 
            allow="geolocation; camera; microphone">
        </iframe>
    </div>

</body>
</html>

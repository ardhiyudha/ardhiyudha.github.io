<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #f3f4f6;
        }

        .iframe-container {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Penting agar bagian yang ter-scale tidak 'luber' */
        }

        iframe {
            position: absolute;
            top: 0;
            left: 0;
            /* Kita buat ukuran aslinya sedikit lebih kecil agar saat di-scale tidak pecah 
               dan tetap memenuhi layar tanpa scrollbar horizontal berlebih */
            width: 90.9%;  /* Rumus: 100 / scale_factor (100 / 1.1) */
            height: 90.9%; 
            
            border: none;
            
            /* Trick Scale Up */
            transform: scale(1.1); /* Perbesar 110%. Ganti ke 1.2 jika ingin lebih besar */
            transform-origin: 0 0; /* Mulai pembesaran dari pojok kiri atas */
            
            /* Penyesuaian lebar akhir agar tetap full screen */
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbxT_2_bsjZfbnZYe6Cew4sUO-MasOlHofzbGKkhmq9M23AjTJV0oYtYQ-i1_0QdHI0c/exec" 
            allow="geolocation; camera; microphone">
        </iframe>
    </div>

</body>
</html>
